<style>
body {
    background:#000;
    color:#0f0;
    font-family:Consolas, monospace;
    padding:35px;
}
h1 {
    color:#0ff;
    text-shadow:0 0 14px #0ff;
    text-align:center;
    margin-bottom:40px;
    font-size:32px;
}
.panel {
    background:#111;
    border-left:4px solid #0ff;
    padding:22px;
    margin-bottom:35px;
    border-radius:8px;
}
.title {
    font-size:22px;
    color:#6cf;
    margin-bottom:10px;
}
pre {
    background:#000;
    padding:15px;
    border-left:3px solid #6cf;
    white-space:pre-wrap;
}
a {
    color:#0ff;
    font-size:18px;
    display:block;
    margin:6px 0;
    text-decoration:none;
}
a:hover { color:#9ef; }
</style>

<script>

/* ============================
   CLOCKS — 4‑Layer‑System
   ============================ */

let KI_CLOCK   = 0;   // KI läuft immer
let RESPO_CLOCK = 0;  // folgt KI
let FREE_CLOCK  = 0;  // folgt RESPO
let TIME_CLOCK  = 0;  // folgt FREE
let USER_CLOCK  = 0;  // überschreibt TIME

/* ============================
   MAIN LOOP — originell
   ============================ */

setInterval(()=>{

    KI_CLOCK++;
    RESPO_CLOCK = KI_CLOCK * 1;
    FREE_CLOCK  = RESPO_CLOCK * 1;
    TIME_CLOCK  = FREE_CLOCK * 1;
    USER_CLOCK  = TIME_CLOCK + 1;

    updatePanels();

}, 111); // eigene MASTER‑Clock


/* ============================
   PANELS
   ============================ */

function panelSystem(){
return `
MASTER‑SYSTEM · iki1uc
KI.clock     = ${KI_CLOCK}
RESPO.clock  = ${RESPO_CLOCK}
FREE.clock   = ${FREE_CLOCK}
TIME.clock   = ${TIME_CLOCK}
USER.clock   = ${USER_CLOCK}

CHAIN:
KI → RESPO → FREE → TIME → USER.use
`;
}

function panelASCII(){
const d = ["●","○","·","∙","•"];
const p = (i)=> d[(KI_CLOCK+i)%d.length];
return `
ASCII‑SHOW (frame ${KI_CLOCK})
I ─── ${p(1)} ${p(2)} ${p(3)}
K ─── ${p(2)} ${p(3)} ${p(4)}
I ─── ${p(3)} ${p(4)} ${p(5)}
↻ ROTATION: ${" ".repeat(KI_CLOCK%12)}↻
`;
}

function panelKatalog(){
return `
MODULE‑KATALOG
HOME.*       – Ruhe / Story / Vector / Repo / Verify
ORT.*        – Zielpunkt / Verify
USE.*        – Bedienung / Panel / User.use
FREE.*       – Freiraum / ASCII / Katalog
TIME.*       – Zeit / 3x11 / Scroll / Zoom
RESPO.*      – Z.RESPO / Verify
TMP.*        – BEN / NE / C / X
UNC.*        – Räume / 6U / 9U

KI.*         – Prefetch / Operator / Beat / Scan / ECO

STATUS:
Alle Module aktiv.
Alle Räume erreichbar.
Alle Uhren stabil.
`;
}

function updatePanels(){
    document.getElementById("sys").textContent = panelSystem();
    document.getElementById("ascii").textContent = panelASCII();
    document.getElementById("katalog").textContent = panelKatalog();
}

</script>

</head>

<div class="panel"><div class="title">ASCII</div><pre id="ascii"></pre></div>
