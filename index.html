<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>FREE · RESPO‑READY · iki1uc</title>

<style>
body { background:#000; color:#0f0; font-family:Consolas, monospace; padding:30px; }
h1 { color:#0ff; text-shadow:0 0 12px #0ff; text-align:center; margin-bottom:30px; }

.block {
    background:#111;
    border-left:4px solid #0ff;
    padding:20px;
    margin-bottom:30px;
    border-radius:8px;
}

.title {
    font-size:22px;
    color:#6cf;
    margin-bottom:10px;
}

pre {
    background:#000;
    padding:15px;
    border-left:3px solid #6cf;
    white-space:pre-wrap;
}
</style>

<script>

/* ============================
   FREE‑CLOCK — unabhängig
   ============================ */

let FREE_CLOCK = 0;

/* ============================
   FREE‑LOOP — kein TIME‑Share
   ============================ */

setInterval(()=>{
    FREE_CLOCK++;
    updatePanels();
}, 111); // eigene FREE‑Clock, NICHT TIME‑Clock


/* ============================
   PANELS
   ============================ */

function panelFREE(){
return `
FREE · Ebene
Clock: ${FREE_CLOCK}
Status: aktiv
Modus: frei / offen / user‑use
Interferenz: keine
TIME‑Share: deaktiviert
`;
}

function panelASCII(){
const d = ["●","○","·","∙","•"];
const p = (i)=> d[(FREE_CLOCK+i)%d.length];
return `
FREE‑ASCII (frame ${FREE_CLOCK})
F ─── ${p(1)} ${p(2)} ${p(3)}
R ─── ${p(2)} ${p(3)} ${p(4)}
E ─── ${p(3)} ${p(4)} ${p(5)}
E ─── ${" ".repeat(FREE_CLOCK%12)}↻
`;
}

function panelKatalog(){
return `
FREE‑KATALOG
FREE.use   – Freiraum
FREE.work  – freie Arbeit
FREE.home  – freie Ruhe
FREE.ai    – freie KI‑Ebene
FREE.soll  – freie Absicht
FREE.tmp   – freie Konstellation

FREE‑Optionen:
→ User‑Use dominant
→ keine TIME‑Interferenz
→ keine KI‑Blockade
→ keine RESPO‑Teilung
→ freie Navigation
`;
}

function updatePanels(){
    document.getElementById("free").textContent = panelFREE();
    document.getElementById("ascii").textContent = panelASCII();
    document.getElementById("katalog").textContent = panelKatalog();
}

</script>

</head>

<body>

<h1>FREE · RESPO‑READY · iki1uc</h1>

<div class="block"><div class="title">FREE</div><pre id="free"></pre></div>
<div class="block"><div class="title">ASCII</div><pre id="ascii"></pre></div>
<div class="block"><div class="title">FREE‑KATALOG</div><pre id="katalog"></pre></div>

</body>
</html>
